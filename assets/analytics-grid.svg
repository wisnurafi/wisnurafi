<rect x="28" y="118.0" width="6" height="4.0" opacity="0.44"/>
<rect x="38" y="118.0" width="6" height="4.0" opacity="0.49"/>
<rect x="48" y="118.0" width="6" height="4.0" opacity="0.53"/>
<rect x="58" y="118.0" width="6" height="4.0" opacity="0.57"/>
<rect x="68" y="118.0" width="6" height="4.0" opacity="0.61"/>
<rect x="78" y="118.0" width="6" height="4.0" opacity="0.66"/>
<rect x="88" y="118.0" width="6" height="4.0" opacity="0.70"/>
<rect x="98" y="118.0" width="6" height="4.0" opacity="0.74"/>
<rect x="108" y="118.0" width="6" height="4.0" opacity="0.79"/>
<rect x="118" y="100.0" width="6" height="22.0" opacity="0.83"/>
<rect x="128" y="113.7" width="6" height="8.3" opacity="0.87"/>
<rect x="138" y="118.0" width="6" height="4.0" opacity="0.91"/>
<rect x="148" y="102.9" width="6" height="19.1" opacity="0.96"/>
<rect x="158" y="112.3" width="6" height="9.7">
