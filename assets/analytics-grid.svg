    <polyline points="18,101.5 38,100.0 58,122.0 78,122.0 98,122.0 118,122.0 138,122.0 158,122.0 178,122.0 198,122.0 218,122.0 238,122.0" fill="none" stroke="#4ade80" stroke-width="1.4"/>
