      <circle cx="152" cy="106" r="5" fill="#67e8f9" opacity="1.00"/><text x="152" y="120" text-anchor="middle">F</text>
      <circle cx="182" cy="106" r="5" fill="#67e8f9" opacity="0.62"/><text x="182" y="120" text-anchor="middle">S</text>
      <circle cx="212" cy="106" r="5" fill="#1a2540"/><text x="212" y="120" text-anchor="middle">S</text>
